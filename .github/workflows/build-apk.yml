name: Build Android APK (Plants)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build & Package Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install npm dependencies
        run: |
          npm ci || npm install --legacy-peer-deps

      - name: Build Web Application (Vite)
        run: npm run build
        env:
          NODE_ENV: production

      - name: Accept Android SDK Licenses & Prepare Tools
        run: |
          echo "Accepting Android SDK licenses..."
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Ensure Capacitor Android Platform Exists & Sync
        run: |
          if [ ! -d "android" ] || [ ! -f "android/gradlew" ]; then
            echo "android folder or gradlew not found. Adding Android platform via Capacitor..."
            npx cap add android
          else
            echo "Existing android folder detected."
          fi
          echo "Syncing web assets to Capacitor Android..."
          npx cap sync android

      - name: Make gradlew executable
        run: |
          ls -la android/
          chmod +x android/gradlew

      - name: Build Android Debug APK with Gradle
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Verify Generated APK
        run: |
          ls -lh android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Plants Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Plants-CropDoctor-app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
