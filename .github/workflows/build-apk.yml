name: Build Android APK (Plants)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build & Package Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install npm dependencies
        run: |
          npm ci || npm install --legacy-peer-deps

      - name: Build Web Application (Vite)
        run: npm run build
        env:
          NODE_ENV: production

      - name: Sync Capacitor Android
        run: |
          npx cap sync android

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build Android Debug APK with Gradle
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Verify Generated APK
        run: |
          ls -lh android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Plants Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Plants-CropDoctor-app-debug.apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
